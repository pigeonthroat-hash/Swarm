<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Swarm: a clean chat client for your AI provider. Runs entirely in your browser.">
  <title>Swarm</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23d97757'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo"></span><span>Swarm</span></div>
    <button class="new-chat" id="newChat" type="button">＋ New chat</button>
    <div class="label">Recent</div>
    <div class="history" id="history"></div>
    <button class="new-chat" id="openSettings" type="button">⚙ Settings</button>
  </aside>

  <section class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSide" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
      <select class="model-select" id="modelSelect" aria-label="Model"></select>
      <div class="spacer"></div>
    </header>

    <div class="scroll" id="scroll">
      <div class="empty" id="empty">
        <span class="logo big"></span>
        <h1>What can I help with?</h1>
        <div class="chips" id="chips"></div>
      </div>
      <div class="thread" id="thread" hidden></div>
    </div>

    <div class="composer-wrap">
      <div class="notice" id="notice" hidden></div>
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message Swarm…" aria-label="Message"></textarea>
        <div class="composer-bar">
          <span class="hint">Enter to send · Shift+Enter for a new line</span>
          <button class="send" id="send" type="submit" aria-label="Send">↑</button>
        </div>
      </form>
    </div>
  </section>
</div>

<!-- Setup wizard: provider → key → model -->
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <div class="sheet-head">
      <h2 id="setupTitle">Connect an AI provider</h2>
      <button class="icon-btn" id="closeSetup" type="button" aria-label="Close" hidden>✕</button>
    </div>

    <div id="step1">
      <p class="muted">Pick a provider. Your API key is saved only in this browser.</p>
      <div class="providers" id="providers"></div>
    </div>

    <div id="step2" hidden>
      <p class="muted" id="step2Title"></p>
      <label class="field-label" for="apiKey">API key</label>
      <input class="field" id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key">
      <div id="baseWrap" hidden>
        <label class="field-label" for="baseUrl">Base URL</label>
        <input class="field" id="baseUrl" type="url" placeholder="https://your-host.example/v1" spellcheck="false">
      </div>
      <p class="help" id="keyHelp"></p>
      <p class="sheet-err" id="setupError" hidden></p>
      <div class="row-btns">
        <button class="btn ghost" id="back1" type="button">Back</button>
        <button class="btn" id="verify" type="button">Load models</button>
      </div>
    </div>

    <div id="step3" hidden>
      <p class="muted">Choose a model. You can switch later from the top bar.</p>
      <div class="model-list" id="modelList"></div>
      <div class="row-btns">
        <div class="btn-group">
          <button class="btn ghost" id="back2" type="button">Back</button>
          <button class="btn danger" id="removeKey" type="button">Remove key</button>
        </div>
        <button class="btn" id="finish" type="button">Start chatting</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
