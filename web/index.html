<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm</title>
<style>
  :root {
    --bg: #0a0a0b;
    --fg: #e9e9ec;
    --dim: #6e6e78;
    --line: #1d1d22;
    --bubble: #17171b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  main {
    width: 100%; max-width: 680px; height: 100%;
    display: flex; flex-direction: column; padding: 0 20px;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 22px 0 18px; border-bottom: 1px solid var(--line);
  }
  header b { font-weight: 600; letter-spacing: 0.02em; }
  header span { color: var(--dim); font-size: 13px; }

  #log {
    flex: 1; overflow-y: auto; padding: 24px 0;
    display: flex; flex-direction: column; gap: 18px;
  }
  .msg { max-width: 88%; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: var(--bubble); padding: 9px 14px; border-radius: 16px 16px 4px 16px; }
  .bot { align-self: flex-start; }
  .dim { color: var(--dim); font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: #b9b9c2; }

  form {
    display: flex; gap: 10px; padding: 16px 0 22px; border-top: 1px solid var(--line);
  }
  input {
    flex: 1; min-width: 0; background: transparent; color: var(--fg);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 11px 18px; font: inherit; outline: none; transition: border-color .15s;
  }
  input::placeholder { color: var(--dim); }
  input:focus { border-color: #3a3a44; }
  button {
    background: var(--fg); color: var(--bg); border: 0; border-radius: 999px;
    padding: 0 20px; font: inherit; font-weight: 500; cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>
<main>
  <header>
    <b>swarm</b>
    <span>/help for commands</span>
  </header>

  <div id="log" aria-live="polite"></div>

  <form id="composer" autocomplete="off">
    <input id="input" placeholder="Message, or /submit counter {&quot;steps&quot;:5}" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function add(kind, text, mono = false) {
    const el = document.createElement("div");
    el.className = "msg " + kind + (mono ? " mono" : "");
    el.textContent = text;            // textContent: never inject HTML
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function watch(taskId) {
    const status = add("bot dim", "running " + taskId + " …");
    for (;;) {
      await sleep(1000);
      const res = await fetch("/api/tasks/" + encodeURIComponent(taskId));
      if (!res.ok) { status.textContent = "lost track of " + taskId; return; }
      const task = await res.json();
      if (task.status === "done" || task.status === "failed") {
        status.remove();
        if (task.status === "done") {
          add("bot mono", JSON.stringify(task.result, null, 2), true);
        } else {
          add("bot", "failed: " + (task.error || "unknown error"));
        }
        return;
      }
      status.textContent = "running " + taskId + " · " + task.status;
    }
  }

  async function send(text) {
    add("me", text);
    sendBtn.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const reply = await res.json();
      if (!res.ok) {
        add("bot dim", reply.error || "request failed");
        return;
      }
      if (reply.text) add("bot", reply.text);
      if (reply.task_id && reply.text.startsWith("Queued")) watch(reply.task_id);
    } catch (err) {
      add("bot dim", "can't reach the swarm server");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send(text);
  });

  add("bot dim", "Ready. Plain text runs the echo agent. Try /agents or /help.");
</script>
</body>
</html>
